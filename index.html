<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naira</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Naira personal AI trading assistant" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Naira</h1>
    <p class="subtitle">Your personal AI assistant</p>

    <div class="status-bar">
      <span class="status-dot"></span>
      <span>Basic version live</span>
    </div>

    <div class="chat-box">
      <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </div>

    <div id="responseBox">Welcome sir. I am Naira.</div>

    <div class="help-box">
      <p><strong>Try:</strong> hello, who are you, what can you do, naira pro, open trading</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
